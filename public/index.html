<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PriceSignal</title>
<style>
:root{
  --bg:#f6f5f1;--panel:#ffffff;--ink:#1d1f23;--muted:#6a6f78;--line:#e3e1da;--accent:#0f6e5c;--accent-soft:#e2f1ec;
  --warn:#9a5b00;--warn-soft:#fdf0dc;--bad:#a3271f;--bad-soft:#fbe5e2;--chip:#efede7;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--panel:#1a1d21;--ink:#e9e7e2;--muted:#9aa0a8;--line:#2b2f35;--accent:#4fc3a6;--accent-soft:#163a31;--warn:#f0b35a;--warn-soft:#3a2c14;--bad:#f08a80;--bad-soft:#3d1e1b;--chip:#23272c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:12px}.brand b{font-size:20px;letter-spacing:-.01em}.brand span{color:var(--muted);font-size:13px}
.status{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
.pill{padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}.pill.ok{background:var(--accent-soft);color:var(--accent)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
main{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:20px;padding:20px 28px;max-width:1500px;margin:0 auto}
main>*{min-width:0}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr);padding:16px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
textarea{width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:var(--bg);color:var(--ink)}
button{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}button:disabled{opacity:.5;cursor:wait}
.examples{display:flex;flex-direction:column;gap:6px;margin:10px 0 12px}.examples button{background:var(--chip);color:var(--ink);font-weight:400;text-align:left;font-size:13px;padding:8px 10px}
.trace{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:56vh;overflow:auto}
.trace li>span:last-child{min-width:0;overflow-wrap:anywhere}
.trace li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;font-size:13px;padding:6px 8px;border-radius:6px;background:var(--bg)}
.k{font:600 11px var(--mono);text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--chip);color:var(--muted);height:fit-content;text-align:center}
.k.memory{background:var(--accent-soft);color:var(--accent)}.k.discover{background:#e6eefb;color:#2856a8}.k.onboard,.k.compare,.k.pricing,.k.sql{background:#efe7fb;color:#6532a8}.k.warn,.k.error{background:var(--warn-soft);color:var(--warn)}
@media (prefers-color-scheme:dark){.k.discover{background:#1d2a40;color:#8fb3f2}.k.onboard,.k.compare,.k.pricing,.k.sql{background:#2b2140;color:#c4a6f2}}
.skus{width:100%;border-collapse:collapse;font-size:13px}.skus th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line)}.skus td{padding:7px 8px;border-bottom:1px solid var(--line)}.skus td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.markets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mkt h3{margin:0;font-size:16px}.mkt .agency{color:var(--muted);font-size:12px}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:8px 0 0}.sub{color:var(--muted);font-size:12px}
.range{position:relative;height:28px;margin:14px 0 4px;background:var(--bg);border-radius:6px}
.range .band{position:absolute;top:6px;bottom:6px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px}
.range .prop{position:absolute;top:0;bottom:0;width:2px;background:var(--bad)}
.verdict{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.verdict.above{background:var(--bad-soft);color:var(--bad)}.verdict.within{background:var(--accent-soft);color:var(--accent)}.verdict.below{background:var(--warn-soft);color:var(--warn)}
.headline{font-size:19px;font-weight:600;margin:0 0 14px;line-height:1.35}
.notes li{margin:4px 0}
pre{font:12px/1.45 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:260px;white-space:pre}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.right{display:flex;flex-direction:column;gap:16px}
.empty{color:var(--muted);text-align:center;padding:60px 20px}
.src{font:11px var(--mono);color:var(--muted);word-break:break-all}
.prose{font-size:13px;line-height:1.45;margin:10px 0 0}
</style>
</head>
<body>
<header>
  <div class="brand"><b>PriceSignal</b><span>cross-border inflation evidence for pricing decisions</span></div>
  <div class="status" id="status"><span class="pill">checking runtime…</span></div>
</header>
<main>
  <section class="card">
    <h2>Ask</h2>
    <textarea id="q" placeholder="e.g. is food inflation in germany, canada & aus still hot? thinking +5% for Q1"></textarea>
    <div class="examples" id="examples"></div>
    <button id="go">Investigate</button>
    <h2 style="margin-top:18px">What the agent is doing</h2>
    <ul class="trace" id="trace"><li><span class="k">idle</span><span class="sub">Steps appear here as the agent works.</span></li></ul>
  </section>
  <section class="right" id="out"><div class="card empty">The brief will appear here: one card per market, the fragmentation the agent had to resolve, and the SQL behind every number.</div></section>
</main>
<script>
const EX=[
  "our gochujang & snacks: is food inflation in deutschland, canada & aus still running hot?? thinking +5% for Q1, too much? we usually pass on ~70% of cost increases",
  "독일 캐나다 호주 식품 물가 요즘 어때? 내년 1분기에 가격 4% 올려도 될까",
  "france, italy & spain: snack prices up 4% next quarter? we pass on about 60%",
  "same as last time, but what if we only go +3%?",
  "canada & australia food: is +2% enough this quarter? we pass on 70%",
];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
EX.forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>{$("#q").value=t};$("#examples").appendChild(b)});
// The model that actually answered (from the trace) stays in the header after the status refresh.
let servedModel=null;
function showModel(){const p=$("#modelpill");if(servedModel&&p){p.textContent=servedModel.t;p.className=servedModel.c}}
async function status(){try{const s=await (await fetch("/api/status")).json();
  $("#status").innerHTML=`<span class="pill ${s.state==="online"?"ok":"bad"}">${s.provider==="meterless"?"Meterless Nightshift":s.provider} · ${esc(s.state)}</span><span class="pill" id="modelpill">model: ${esc(s.fast)} (Nightshift lane)</span><span class="pill ${s.zetaris==="online"?"ok":"bad"}">Zetaris · ${esc(s.zetaris||"unknown")}</span><span class="pill">H-MEM · ${s.memoryRecords} memories</span>`;showModel();
}catch(e){$("#status").innerHTML=`<span class="pill bad">server unreachable</span>`}}
status();
function addTrace(e){const mm=String(e.title).match(/[\w.-]+\/[\w.-]*nemotron[\w.:-]*/i)||String(e.title).match(/\(([\w.-]+\/[\w.:-]+),/);if(mm&&$("#modelpill")){const m=(mm[1]||mm[0]);const nv=/nemotron/i.test(m);servedModel={t:(nv?"model: ":"model (not Nemotron!): ")+m+" via Nightshift",c:"pill "+(nv?"ok":"bad")};showModel()}const li=document.createElement("li");li.innerHTML=`<span class="k ${esc(e.kind)}">${esc(e.kind)}</span><span>${esc(e.title)}</span>`;$("#trace").appendChild(li);li.scrollIntoView({block:"nearest"})}
function spark(points){if(!points||points.length<2)return"";const w=220,h=44,ys=points.map(p=>p.yoy),mn=Math.min(...ys,0),mx=Math.max(...ys);const sx=i=>i*(w/(points.length-1)),sy=v=>h-4-((v-mn)/((mx-mn)||1))*(h-8);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="year-on-year trend"><polyline fill="none" stroke="currentColor" stroke-width="2" points="${points.map((p,i)=>sx(i)+","+sy(p.yoy)).join(" ")}"/><circle cx="${sx(points.length-1)}" cy="${sy(ys.at(-1))}" r="3" fill="currentColor"/></svg>`}
function card(f,prop,text){const s=f.category||f.allItems;if(!s)return`<div class="card mkt"><h3>${f.country}</h3><div class="agency">${esc(f.agency)}</div><p class="sub">No usable series.</p></div>`;
  const max=Math.max(prop??0,f.suggested?.high??0,s.latestYoy,1)*1.25,pct=v=>Math.max(0,Math.min(100,v/max*100));
  const vcls=f.verdict?f.verdict.split(" ")[0]:"";
  return `<div class="card mkt"><h3>${f.country}</h3><div class="agency">${esc(f.agency)} · ${esc(s.label)}</div>
  <div class="big">${s.latestYoy>0?"+":""}${s.latestYoy.toFixed(1)}%</div><div class="sub">year on year, ${esc(s.latestPeriod)} · ${esc(s.trend)} · 12-period avg ${s.avg12.toFixed(1)}%${f.allItems&&f.category?` · all-items ${f.allItems.latestYoy.toFixed(1)}%`:""}${f.monthsStale>2?` · <b style="color:var(--warn)">${f.monthsStale} months old</b>`:""}</div>
  <div style="color:var(--accent);margin-top:6px">${spark(s.points)}</div>
  ${f.suggested?`<div class="range" title="suggested range"><div class="band" style="left:${pct(f.suggested.low)}%;width:${Math.max(1.5,pct(f.suggested.high)-pct(f.suggested.low))}%"></div>${prop!=null?`<div class="prop" style="left:${pct(prop)}%" title="proposed +${prop}%"></div>`:""}</div>
  <div class="sub">suggested ${f.suggested.low.toFixed(1)}–${f.suggested.high.toFixed(1)}%${prop!=null?` · proposed +${prop}%`:""}</div>`:""}
  ${f.verdict?`<span class="verdict ${vcls}">proposed change is ${esc(f.verdict)}</span>`:""}
  ${text?`<p class="prose">${esc(text)}</p>`:""}
  <div class="src" style="margin-top:8px">${esc(s.sourceId)} · ${esc(f.cite)}</div></div>`}
function render(r,question){const prop=(r.facts.find(f=>f.verdict)?undefined:undefined);
  const md=r.markdown||"";const headline=(md.match(/^\*\*(.+)\*\*$/m)||[])[1];
  const proposed=(md.match(/proposed change: \+([\d.]+)%/)||[])[1]??(r.proposed!=null?String(r.proposed):undefined);
  $("#out").innerHTML=`<div class="card">${headline?`<p class="headline">${esc(headline)}</p>`:r.partial?`<p class="headline" style="color:var(--muted)">Numbers ready - NVIDIA Nemotron is writing the summary…</p>`:""}<div class="sub">Policy: pass through ${Math.round(r.passThrough*100)}% of category inflation${r.policySource?` (${esc(r.policySource)})`:""} · ${r.partial?"numbers ready in":"finished in"} ${(r.ms/1000).toFixed(1)} s · ${r.sql.length} SQL statements · ${r.views.filter(v=>v.via==="memory").length} of ${r.views.length} sources recalled from memory</div>${r.narrative?`<div class="sub" style="margin-top:6px">${r.narrative.watch?`<b>Watch:</b> ${esc(r.narrative.watch)} · `:""}Summary written by NVIDIA Nemotron via Meterless Nightshift; every number in it was checked against the computed facts.</div>`:r.partial?"":`<div class="sub" style="margin-top:6px">No model-written summary this time (${esc({grounding:"its numbers did not match the facts",unusable:"the reply was not usable",provider:"the model provider returned an error or timed out",budget:"the time budget ran out"}[r.narrativeIssue]||"not available")}); the headline and every figure are computed in code.</div>`}</div>
  <div class="markets">${r.facts.map(f=>card(f,proposed!=null?Number(proposed):null,r.narrative?.markets?.[f.country])).join("")}</div>
  ${r.sinceLast&&r.sinceLast.length?`<div class="card"><h2>Since your last brief · remembered in H-MEM</h2><ul class="notes">${r.sinceLast.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`:""}
  ${r.skus&&r.skus.length?`<div class="card"><h2>Your price list · internal data joined in Zetaris (${esc(r.pricing?.id)}) · each product on its own category</h2><table class="skus"><tr><th>SKU</th><th>Product</th><th>Market</th><th style="text-align:right">Current</th><th style="text-align:right">Suggested new price</th>${proposed!=null?`<th style="text-align:right">At +${esc(proposed)}%</th>`:""}<th style="text-align:right">Rate used</th></tr>${r.skus.map(s=>`<tr><td><b>${esc(s.sku)}</b></td><td>${esc(s.product)}</td><td>${esc(s.country)}</td><td class="num">${s.currentPrice.toFixed(2)} ${esc(s.currency)}</td><td class="num">${s.low!=null?`${s.low.toFixed(2)}–${s.high.toFixed(2)} ${esc(s.currency)}`:"-"}${s.rangeLow!=null?`<div class="sub">+${s.rangeLow.toFixed(1)}–${s.rangeHigh.toFixed(1)}%</div>`:""}</td>${proposed!=null?`<td class="num" style="color:${s.verdict&&s.verdict.startsWith("above")?"var(--warn)":"inherit"}">${s.atProposed!=null?s.atProposed.toFixed(2):"-"}${s.verdict?`<div class="sub">${esc(s.verdict.split(" ")[0])}</div>`:""}</td>`:""}<td class="num">${s.yoy>0?"+":""}${s.yoy.toFixed(1)}% ${esc(s.period)}${s.rateLabel?`<div style="font-family:var(--sans,inherit);font-size:11px;color:var(--muted);white-space:normal">${esc(s.rateLabel)}${s.coarser?" · coarser":""}</div>`:""}</td></tr>`).join("")}</table></div>`:""}
  ${r.notes.length?`<div class="card"><h2>Fragmentation the agent resolved</h2><ul class="notes">${r.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`:""}
  <div class="card"><h2>Evidence</h2><p class="sub">Every rate above comes from Zetaris query <b>${esc(r.compared.id)}</b> — one federated SQL across the sources the agent onboarded (${r.views.map(v=>"psig."+esc(v.view)+" ("+esc(v.via)+")").join(", ")}). Suggested ranges, verdicts and SKU prices are computed in code from those rates and your pass-through policy.</p><pre>${esc(r.compared.sql)}</pre>${r.pricing?`<p class="sub">Internal price list joined with the official rates in <b>${esc(r.pricing.id)}</b>:</p><pre>${esc(r.pricing.sql)}</pre>`:""}
  <details><summary>All ${r.sql.length} statements the agent ran</summary>${r.sql.map(q=>`<pre>-- ${esc(q.id)} · ${q.rows} rows · ${q.ms} ms\n${esc(q.sql)}</pre>`).join("")}</details>
  <details><summary>Brief as Markdown</summary><pre>${esc(md)}</pre></details></div>`;status()}
$("#go").onclick=async()=>{const q=$("#q").value.trim();if(!q)return;$("#go").disabled=true;$("#trace").innerHTML="";$("#out").innerHTML=`<div class="card empty">Working…</div>`;
  try{const {id,error}=await (await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})})).json();if(error)throw new Error(error);
  const es=new EventSource("/api/stream/"+id);es.onmessage=m=>addTrace(JSON.parse(m.data));
  es.addEventListener("partial",m=>render(JSON.parse(m.data),q));
  es.addEventListener("result",m=>{es.close();render(JSON.parse(m.data),q);$("#go").disabled=false});
  es.addEventListener("failure",m=>{es.close();$("#out").innerHTML=`<div class="card"><b>Failed</b><pre>${esc(JSON.parse(m.data).error)}</pre></div>`;$("#go").disabled=false});
  }catch(e){$("#out").innerHTML=`<div class="card"><b>Failed</b><pre>${esc(e)}</pre></div>`;$("#go").disabled=false}};
</script>
</body>
</html>
